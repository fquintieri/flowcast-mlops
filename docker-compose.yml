services:
  postgres:
    image: postgres:15-alpine
    container_name: flowcast_postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.9.0-python3.10
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@flowcast.com

  airflow-webserver:
    image: apache/airflow:2.9.0-python3.10
    container_name: flowcast_airflow_webserver
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY= 'flowcast_secret_key_12345'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./airflow/logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.0-python3.10
    container_name: flowcast_airflow_scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY= 'flowcast_secret_key_12345'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./airflow/logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler

  ml_agent:
    build:
      context: ./ml_agent
      dockerfile: Dockerfile
    image: flowcast-mlagent:latest
    container_name: flowcast_mlagent
    environment:
      - KAGGLE_API_TOKEN=${KAGGLE_API_TOKEN}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - MODEL_NAME=${MODEL_NAME}
    volumes:
      - ./data:/app/data
      - ./ml_agent/src:/app/src
    profiles: ["tools"]

  mlflow_ui:
    build:
      context: ./ml_agent
      dockerfile: Dockerfile
    container_name: flowcast_mlflow_ui
    command: mlflow server --backend-store-uri sqlite:////app/data/mlflow.db --default-artifact-root /app/data/mlruns --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: flowcast_dashboard
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./dashboard:/app

volumes:
  postgres-db-volume: